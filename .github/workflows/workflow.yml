# Publish to PyPI through Trusted Publishing (OIDC): no API token is stored anywhere.
# Runs on a version tag (v0.1.0) or by hand. The suite must pass before anything is uploaded.
name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and runtime dependencies
        run: python -m pip install .
      - name: Run the suite
        run: python -m unittest discover -s tests
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check built wheel outside checkout
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -m lectic.scripts.release_check
      - name: Check built source distribution outside checkout
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.tar.gz
          cd "$RUNNER_TEMP"
          python -m lectic.scripts.release_check
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # what PyPI trusts; nothing else is granted
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
