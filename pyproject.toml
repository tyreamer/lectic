[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lectic"
version = "0.3.1"
description = "Turn the talks, courses and transcripts you trust into expertise your AI assistants can apply, with evidence, across Claude Code, Codex, ChatGPT, Claude and Gemini."
keywords = ["mcp", "knowledge", "transcripts", "youtube", "claude-code", "codex", "chatgpt", "agent-skills", "evidence"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["cryptography>=38", "tomli>=2; python_version < '3.11'"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
youtube = ["yt-dlp"]

[project.urls]
Homepage = "https://github.com/tyreamer/lectic"
Issues = "https://github.com/tyreamer/lectic/issues"

[project.scripts]
lectic = "lectic.cli:main"

# The repository root is the package: scripts, prompts, schemas and fixtures travel together,
# so ec.ROOT (the parent of scripts/) resolves the same way from a checkout or an install.
[tool.setuptools]
packages = ["lectic", "lectic.scripts", "lectic.scripts.ingestors"]
package-dir = {"lectic" = "."}
include-package-data = true

[tool.setuptools.package-data]
lectic = [
    "SKILL.md", "README.md", "LICENSE", "NORTH_STAR.md", "DESIGN.md", "AGENTS.md",
    "agents/*.yaml", "prompts/*.md", "schemas/*.json", "docs/*.md", "registry/*.json",
    "fixtures/*", "fixtures/**/*",
]
